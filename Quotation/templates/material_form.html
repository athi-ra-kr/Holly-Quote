{% extends 'dashboard.html' %}
{% block content %}

<style>
.page-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
}

.form-box {
    width:100%;
    max-width:500px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

select, input, textarea {
    width:100%;
    padding:12px;
    margin-top:12px;
    border:1px solid #e2e8f0;
    border-radius:10px;
    outline:none;
    transition:0.3s;
    font-family: inherit;
}

select:focus, input:focus, textarea:focus{
    border-color:#2a5298;
    box-shadow:0 0 0 2px rgba(42,82,152,0.1);
}

button {
    margin-top:20px;
    background:#2a5298;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    width:100%;
    font-weight:600;
    cursor:pointer;
    transition:0.3s;
}

button:hover{
    background:#1e3c72;
}
</style>

<div class="page-container">
    <div class="form-box">

        <h2>{% if material %}Edit{% else %}Add{% endif %} Material</h2>

        <form method="POST">
            {% csrf_token %}

            <select name="unit" required>
                <option value="">Select Unit</option>
                {% for u in units %}
                <option value="{{ u.id }}"
                    {% if material and material.unit.id == u.id %}selected{% endif %}>
                    {{ u.name }}
                </option>
                {% endfor %}
            </select>

            <input type="text" name="name" placeholder="Material Name"
                   value="{{ material.name|default:'' }}" required>

            <textarea name="description" placeholder="Material Description (Optional)" rows="3">{% if material.description %}{{ material.description }}{% endif %}</textarea>

            <input type="number" step="0.01" name="rate" placeholder="Rate"
                   value="{{ material.rate|default:'' }}" required>

            <button type="submit">Save</button>
        </form>

    </div>
</div>

{% endblock %}
