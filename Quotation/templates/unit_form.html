{% extends 'dashboard.html' %}
{% block content %}

<style>
.form-box {
    max-width:500px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}
input {
    width:100%;
    padding:12px;
    margin-top:10px;
    border:1px solid #e2e8f0;
    border-radius:10px;
}
button {
    margin-top:20px;
    background:#2a5298;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    width:100%;
}
</style>

<h2>{% if unit %}Edit{% else %}Add{% endif %} Unit</h2>

<div class="form-box">
<form method="POST">
    {% csrf_token %}
    <input type="text" name="name" placeholder="Unit Name"
           value="{{ unit.name|default:'' }}" required>
    <button type="submit">Save</button>
</form>
</div>

{% endblock %}
