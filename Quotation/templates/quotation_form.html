{% extends 'dashboard.html' %}
{% block content %}

<style>
.page-container{
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:70vh;
}

.form-box {
    width:100%;
    max-width:500px;
    background:white;
    padding:30px;
    border-radius:16px;
    box-shadow:0 10px 30px rgba(0,0,0,0.05);
}

h2{
    text-align:center;
    margin-bottom:20px;
}

input {
    width:100%;
    padding:12px;
    margin-top:12px;
    border:1px solid #e2e8f0;
    border-radius:10px;
}

button {
    margin-top:20px;
    background:#2a5298;
    color:white;
    padding:12px;
    border:none;
    border-radius:10px;
    width:100%;
}
</style>

<div class="page-container">
<div class="form-box">

<h2>{% if q %}Edit{% else %}Add{% endif %} Quotation</h2>

<form method="POST">
{% csrf_token %}

<input type="text" name="client_name" placeholder="Client Name"
       value="{{ q.client_name|default:'' }}" required>

<input type="text" name="mobile" placeholder="Mobile Number"
       value="{{ q.mobile|default:'' }}" required>

<input type="text" name="project_type" placeholder="Project Type"
       value="{{ q.project_type|default:'' }}" required>

<button type="submit">Save</button>

</form>

</div>
</div>

{% endblock %}
